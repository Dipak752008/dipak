{% extends 'base.html' %}

{% block content %}

<style>

body{
    background:#367ad3;
}

.add-card{
    max-width:700px;
    margin:auto;
    border:none;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.card-header{
    background:linear-gradient(135deg,#4f46e5,#2563eb,#06b6d4);
    color:white;
    text-align:center;
    padding:25px;
}

.form-control,
.form-select{
    border-radius:12px;
    padding:12px;
}

.form-control:focus,
.form-select:focus{
    box-shadow:0 0 10px rgba(37,99,235,.35);
    border-color:#2563eb;
}

.btn-save{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    border:none;
    border-radius:12px;
    padding:12px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.btn-save:hover{
    transform:translateY(-2px);
}

</style>

<div class="container mt-5">

<div class="card add-card">

<div class="card-header">

<h2>➕ Add New Student</h2>

<p class="mb-0">
Fill all student details carefully.
</p>

</div>

<div class="card-body p-4">

<form method="POST" enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label fw-bold">
👨‍🎓 Student Name
</label>

<input
type="text"
name="name"
class="form-control"
placeholder="Enter Student Name"
required>

</div>

<div class="mb-3">

<label class="form-label fw-bold">
🎫 Roll Number
</label>

<input
type="text"
name="roll"
class="form-control"
placeholder="Enter Roll Number"
required>

</div>

<div class="row">

<div class="col-md-6">

<div class="mb-3">

<label class="form-label fw-bold">
📊 Attendance %
</label>

<input
type="number"
name="attendance"
class="form-control"
placeholder="Attendance"
required>

</div>

</div>

<div class="col-md-6">

<div class="mb-3">

<label class="form-label fw-bold">
📝 Marks
</label>

<input
type="number"
name="marks"
class="form-control"
placeholder="Marks"
required>

</div>

</div>

</div>

<div class="mb-3">

<label class="form-label fw-bold">
🏫 Branch
</label>

<select name="branch" class="form-select" required>

<option value="">Select Branch</option>

<option value="Computer Engineering">
💻 Computer Engineering
</option>

<option value="Mechanical Engineering">
⚙️ Mechanical Engineering
</option>

<option value="Civil Engineering">
🏗️ Civil Engineering
</option>

<option value="Electrical Engineering">
⚡ Electrical Engineering
</option>

<option value="Electronics & Telecommunication">
📡 Electronics & Telecommunication
</option>

<option value="Artificial Intelligence & Data Science">
🤖 Artificial Intelligence & Data Science
</option>

</select>

</div>

<div class="mb-4">

<label class="form-label fw-bold">
📷 Student Photo
</label>

<input
type="file"
name="photo"
class="form-control"
accept="image/*">

</div>

<button class="btn btn-save w-100">

➕ Add Student

</button>

</form>

</div>

</div>

</div>

{% endblock %}
