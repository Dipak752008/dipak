{% extends "base.html" %}

{% block content %}

<style>

.doubt-page{
    min-height:75vh;
    padding:40px 0;
}

.doubt-card{
    max-width:850px;
    margin:auto;
    background:rgba(255,255,255,0.95);
    border:none;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.18);
    overflow:hidden;
}

.doubt-header{
    background:linear-gradient(135deg,#4f46e5,#2563eb,#06b6d4);
    color:white;
    padding:35px;
    text-align:center;
}

.ai-icon{
    width:80px;
    height:80px;
    background:rgba(255,255,255,.2);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    margin:0 auto 15px;
}

.doubt-header h2{
    font-weight:700;
    margin-bottom:8px;
}

.doubt-header p{
    margin:0;
    font-size:16px;
}

.doubt-body{
    padding:35px;
}

.doubt-label{
    font-weight:600;
    font-size:18px;
    margin-bottom:10px;
}

.doubt-input{
    width:100%;
    min-height:150px;
    resize:vertical;
    border:2px solid #e5e7eb;
    border-radius:15px;
    padding:15px;
    font-size:16px;
    outline:none;
    transition:.3s;
}

.doubt-input:focus{
    border-color:#4f46e5;
    box-shadow:0 0 0 4px rgba(79,70,229,.12);
}

.ask-btn{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#4f46e5,#2563eb);
    color:white;
    font-size:18px;
    font-weight:600;
    transition:.3s;
}

.ask-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(37,99,235,.3);
}

</style>

<div class="doubt-page">

<div class="doubt-card">

<div class="doubt-header">

<div class="ai-icon">
🤖
</div>

<h2>AI Doubt Assistant</h2>

<p>Ask your academic doubt and get an AI-powered explanation.</p>

</div>

<div class="doubt-body">

<form method="POST">

<label class="doubt-label">
💡 Enter Your Doubt
</label>

<textarea
name="doubt"
class="doubt-input"
placeholder="Example: What is the difference between TCP and UDP?"
required></textarea>

<button type="submit" class="ask-btn">
🤖 Ask AI
</button>

</form>
{% if answer %}

<div class="mt-4">

<div class="alert alert-success border-0 rounded-4 shadow-sm">

<h4 class="fw-bold mb-3">
💡 AI Answer
</h4>

<div style="
    white-space:pre-wrap;
    font-size:16px;
    line-height:1.7;
">
{{ answer }}
</div>

</div>

</div>

{% endif %}

<div class="text-center mt-4">

<p class="text-muted mb-0">
🎓 College Smart Portal • AI Learning Support
</p>

</div>

</div>

</div>

</div>

{% endblock %}
